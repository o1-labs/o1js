name: Jobs for new commits on main (and similar branches)
on:
  push:
    branches:
      - main
      - develop
  # retry a release (or docs deploy) without making a new commit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel an in-flight native/npm publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  Build-Doc:
    strategy:
      matrix:
        node: [22]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.JS ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run typedoc
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive
          npm ci
          npx typedoc --tsconfig tsconfig.node.json src/index.ts
      - name: Deploy
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

  Auto-merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Try to merge main into version-next
        run: |
          git checkout version-next
          git merge origin/main
          git push origin version-next
        continue-on-error: true

      - name: Create Pull Request if merge failed
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-merge-main-to-version-next-${{ github.sha }}
          title: 'Auto-merge main to version-next (commit ${{ github.sha }})'
          body: 'This PR was automatically created to merge changes from main into version-next. Please resolve conflicts and merge manually.'
          base: version-next

  Pkg-pr-new:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: release-pkg-pr-version
        uses: ./.github/actions/release-pkg-pr-version

  # Detect whether the root package version on this commit differs from what is
  # currently published on npm. Native is expensive to build, so we only run
  # the native release pipeline when the version actually changed.
  #
  # Triggered on push to main (not on Checks succeeding). Checks on main is
  # chronically red for reasons unrelated to publishability (stale VK
  # baseline, DEX/mesa live tests). Gating the release on that suite meant
  # every version bump sat unpublished until someone ran Manual Release.
  # Safety is: version must differ from npm, must not be a prerelease,
  # native-version must be in sync, and npm publish is skipped if the
  # version already exists.
  Check-Version-Change:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare local vs published version
        id: diff
        run: |
          set -euo pipefail
          LOCAL=$(jq -r .version package.json)
          # Default REMOTE to LOCAL so a registry hiccup is treated as
          # "no change" (fail closed: skip release rather than risk a bad publish).
          REMOTE=$(npm view o1js version 2>/dev/null || echo "$LOCAL")
          echo "local=$LOCAL remote=$REMOTE"
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [[ "$LOCAL" == *-* ]]; then
            # prerelease versions (e.g. 3.0.0-mesa.rc2) must never be
            # auto-released as `latest` - use the Manual Release workflow
            echo "local version $LOCAL is a prerelease, skipping auto-release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify @o1js/native versions are in sync with o1js version
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/check-version-sync.mjs

  Release-Native:
    needs: Check-Version-Change
    if: needs.Check-Version-Change.outputs.changed == 'true'
    uses: ./.github/workflows/publish_native.yml
    with:
      npm-tag: latest
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  Release-on-NPM:
    # Runs only when the version changed. Native must publish first because
    # the published o1js package.json gets `@o1js/native` pinned at this
    # version by prepublish-native.ts. If Release-Native fails or is skipped,
    # the default `needs:` cascade skips this job too.
    needs: [Check-Version-Change, Release-Native]
    if: needs.Check-Version-Change.outputs.changed == 'true'
    timeout-minutes: 180
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Free space on runner
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af --volumes || true
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build bindings and package artifacts
        uses: ./.github/actions/build-wasm
        with:
          node_version: 22

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify @o1js/native versions are in sync with o1js version
        run: node scripts/check-version-sync.mjs

      - name: Build publishable o1js package
        run: |
          npm ci
          npm run prepublish:full

      - name: Publish o1js to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.Check-Version-Change.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "o1js@$VERSION" >/dev/null 2>&1; then
            echo "o1js@$VERSION already exists. Skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --provenance --access public --tag latest
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Tag released version
        if: steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ needs.Check-Version-Change.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "Tag $VERSION already exists. Skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub release
        if: steps.publish.outputs.published == 'true'
        uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.Check-Version-Change.outputs.version }}
          generateReleaseNotes: true
          name: Release ${{ needs.Check-Version-Change.outputs.version }}
          skipIfReleaseExists: true
